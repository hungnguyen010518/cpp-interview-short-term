site_name: C++ phỏng vấn — ôn nhanh
site_description: >-
  Khóa ôn C++ ngắn hạn để đi phỏng vấn — giải thích để học sinh lớp 5 cũng hiểu,
  mỗi bài có trắc nghiệm tương tác.
site_url: https://hungnguyen010518.github.io/cpp-interview-short-term/
repo_url: https://github.com/hungnguyen010518/cpp-interview-short-term
repo_name: cpp-interview-short-term
edit_uri: edit/main/docs/
exclude_docs: |
  superpowers/

theme:
  name: material
  language: vi
  icon:
    logo: material/language-cpp
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

plugins:
  - search:
      lang:
        - vi
        - en

