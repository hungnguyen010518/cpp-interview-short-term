site_name: C++ phỏng vấn — ôn nhanh
site_description: >-
  Khóa ôn C++ ngắn hạn để đi phỏng vấn — giải thích để học sinh lớp 5 cũng hiểu,
  mỗi bài có trắc nghiệm tương tác.
site_url: https://hungnguyen010518.github.io/cpp-interview-short-term/
repo_url: https://github.com/hungnguyen010518/cpp-interview-short-term
repo_name: cpp-interview-short-term
edit_uri: edit/main/docs/
exclude_docs: |
  superpowers/

theme:
  name: material
  language: vi
  icon:
    logo: material/language-cpp
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

plugins:
  - search:
      lang:
        - vi
        - en

nav:
  - Trang chủ: index.md
  - Tiến độ của bạn: tien-do.md
  - "Nhóm 1 — Nền tảng và bộ nhớ":
      - "Bài 1 — Stack, heap, con trỏ, tham chiếu, const": nhom-1-nen-tang-bo-nho/01-stack-heap-con-tro.md
      - "Bài 2 — RAII và smart pointer": nhom-1-nen-tang-bo-nho/02-raii-smart-pointer.md
      - "Bài 3 — Move semantics, rule of 0/3/5": nhom-1-nen-tang-bo-nho/03-move-semantics.md
      - "Bài 4 — Tính năng C++11/14/17": nhom-1-nen-tang-bo-nho/04-cpp11-14-17.md
  - Bảng thuật ngữ: glossary.md
