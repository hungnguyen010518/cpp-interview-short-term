site_name: C++ phỏng vấn — ôn nhanh
site_description: >-
  Khóa ôn C++ ngắn hạn để đi phỏng vấn — giải thích để học sinh lớp 5 cũng hiểu,
  mỗi bài có trắc nghiệm tương tác.
site_url: https://hungnguyen010518.github.io/cpp-interview-short-term/
repo_url: https://github.com/hungnguyen010518/cpp-interview-short-term
repo_name: cpp-interview-short-term
edit_uri: edit/main/docs/
exclude_docs: |
  superpowers/

theme:
  name: material
  language: vi
  icon:
    logo: material/language-cpp
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

plugins:
  - search:
      lang:
        - vi
        - en

nav:
  - Trang chủ: index.md
  - Tiến độ của bạn: tien-do.md
  - "Nhóm 1 — Nền tảng và bộ nhớ":
      - "Bài 01 — Chương trình C++ đầu tiên, bộ nhớ, byte và địa chỉ": nhom-1-nen-tang-bo-nho/01-bo-nho-byte-dia-chi.md
      - "Bài 02 — Ba vùng nhớ: stack, heap và vùng tĩnh": nhom-1-nen-tang-bo-nho/02-stack-heap-static.md
      - "Bài 03 — Con trỏ cơ bản": nhom-1-nen-tang-bo-nho/03-con-tro-co-ban.md
      - "Bài 04 — Con trỏ với hàm": nhom-1-nen-tang-bo-nho/04-con-tro-ham.md
      - "Bài 05 — Mảng và phép tính con trỏ": nhom-1-nen-tang-bo-nho/05-mang-phep-tinh-con-tro.md
      - "Bài 06 — Tham chiếu và const": nhom-1-nen-tang-bo-nho/06-tham-chieu-const.md
      - "Bài 07 — Cấp phát động new/delete và ba lỗi kinh điển": nhom-1-nen-tang-bo-nho/07-new-delete.md
      - "Bài 08 — RAII: tài nguyên tự trả khi đối tượng chết": nhom-1-nen-tang-bo-nho/08-raii.md
      - "Bài 09 — std::unique_ptr: một chủ duy nhất cho mỗi cây": nhom-1-nen-tang-bo-nho/09-unique-ptr.md
      - "Bài 10 — std::shared_ptr, std::weak_ptr và cách chọn smart pointer": nhom-1-nen-tang-bo-nho/10-shared-ptr-weak-ptr.md
      - "Bài 11 — Sao chép đúng cách và Rule of 3": nhom-1-nen-tang-bo-nho/11-sao-chep-rule-of-3.md
      - "Bài 12 — Move semantics, rule of 5/0": nhom-1-nen-tang-bo-nho/12-move-semantics.md
      - "Bài 13 — Tính năng C++11 hay gặp": nhom-1-nen-tang-bo-nho/13-cpp11-14-17.md
      - "Bài 14 — Tính năng C++14/17 hay gặp": nhom-1-nen-tang-bo-nho/14-cpp14-17.md
      - "Bài 15 — Hành vi không xác định và công cụ bắt lỗi": nhom-1-nen-tang-bo-nho/15-hanh-vi-khong-xac-dinh-cong-cu.md
  - "Nhóm 2 — STL và thuật toán":
      - "Bài 16 — std::vector: mảng co giãn": nhom-2-stl-thuat-toan/16-vector.md
      - "Bài 17 — string, string_view, array, deque, list": nhom-2-stl-thuat-toan/17-string-array-deque-list.md
      - "Bài 18 — map, set, unordered_map: tra cứu theo khóa": nhom-2-stl-thuat-toan/18-map-set-unordered.md
      - "Bài 19 — Iterator và iterator invalidation": nhom-2-stl-thuat-toan/19-iterator-vo-hieu.md
      - "Bài 20 — <algorithm> và lambda: sort, find, transform, remove-erase": nhom-2-stl-thuat-toan/20-algorithm-lambda.md
      - "Bài 21 — Big-O, danh sách liên kết, stack và queue": nhom-2-stl-thuat-toan/21-big-o-cau-truc-du-lieu.md
      - "Bài 22 — Cây nhị phân tìm kiếm, bảng băm và heap": nhom-2-stl-thuat-toan/22-bst-bang-bam-heap.md
      - "Bài 23 — Thuật toán hay hỏi ở phỏng vấn": nhom-2-stl-thuat-toan/23-thuat-toan-hay-hoi.md
  - "Nhóm 3 — Đa luồng":
      - "Bài 24 — std::thread: tạo luồng, join, detach và truyền tham số": nhom-3-da-luong/24-thread-co-ban.md
      - "Bài 25 — Data race và std::mutex: nhiều luồng cùng sửa một biến": nhom-3-da-luong/25-data-race-mutex.md
      - "Bài 26 — Deadlock: khi các luồng chờ nhau mãi mãi": nhom-3-da-luong/26-deadlock.md
      - "Bài 27 — condition_variable: chờ điều kiện thay vì hỏi liên tục": nhom-3-da-luong/27-condition-variable.md
      - "Bài 28 — std::atomic: thao tác nguyên tử, compare_exchange và cờ dừng": nhom-3-da-luong/28-atomic.md
      - "Bài 29 — std::async và std::future: lấy kết quả từ luồng khác": nhom-3-da-luong/29-async-future.md
      - "Bài 30 — Thread pool và hiệu năng: false sharing, Amdahl": nhom-3-da-luong/30-thread-pool-hieu-nang.md
  - "Nhóm 4 — OOP, template và Design Patterns":
      - "Bài 31 — Lớp và đóng gói: giữ cho đối tượng luôn hợp lệ": nhom-4-oop-patterns/31-lop-dong-goi.md
      - "Bài 32 — Kế thừa: dùng lại lớp cha, và khi nào không nên": nhom-4-oop-patterns/32-ke-thua.md
      - "Bài 33 — Đa hình và virtual: một lời gọi, đúng hàm của món thật": nhom-4-oop-patterns/33-da-hinh-virtual.md
      - "Bài 34 — Template: viết một lần, trình biên dịch làm bản cho từng kiểu": nhom-4-oop-patterns/34-template.md
  - Bảng thuật ngữ: glossary.md
