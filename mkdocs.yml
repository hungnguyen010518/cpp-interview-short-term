site_name: C++ phỏng vấn — ôn nhanh
site_description: >-
  Khóa ôn C++ ngắn hạn để đi phỏng vấn — giải thích để học sinh lớp 5 cũng hiểu,
  mỗi bài có trắc nghiệm tương tác.
site_url: https://hungnguyen010518.github.io/cpp-interview-short-term/
repo_url: https://github.com/hungnguyen010518/cpp-interview-short-term
repo_name: cpp-interview-short-term
edit_uri: edit/main/docs/
exclude_docs: |
  superpowers/

theme:
  name: material
  language: vi
  icon:
    logo: material/language-cpp
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

plugins:
  - search:
      lang:
        - vi
        - en

nav:
  - Trang chủ: index.md
  - Tiến độ của bạn: tien-do.md
  - "Nhóm 1 — Nền tảng và bộ nhớ":
      - "Bài 01 — Chương trình C++ đầu tiên, bộ nhớ, byte và địa chỉ": nhom-1-nen-tang-bo-nho/01-bo-nho-byte-dia-chi.md
      - "Bài 02 — Ba vùng nhớ: stack, heap và vùng tĩnh": nhom-1-nen-tang-bo-nho/02-stack-heap-static.md
      - "Bài 03 — Con trỏ cơ bản": nhom-1-nen-tang-bo-nho/03-con-tro-co-ban.md
      - "Bài 04 — Con trỏ với hàm": nhom-1-nen-tang-bo-nho/04-con-tro-ham.md
      - "Bài 05 — Mảng và phép tính con trỏ": nhom-1-nen-tang-bo-nho/05-mang-phep-tinh-con-tro.md
      - "Bài 06 — Tham chiếu và const": nhom-1-nen-tang-bo-nho/06-tham-chieu-const.md
      - "Bài 07 — Cấp phát động new/delete và ba lỗi kinh điển": nhom-1-nen-tang-bo-nho/07-new-delete.md
      - "Bài 11 — Move semantics, rule of 0/3/5": nhom-1-nen-tang-bo-nho/11-move-semantics.md
      - "Bài 12 — Tính năng C++11/14/17": nhom-1-nen-tang-bo-nho/12-cpp11-14-17.md
      - "Bài 13 — Memory leak, dangling, UB": nhom-1-nen-tang-bo-nho/13-memory-leak-ub.md
  - Bảng thuật ngữ: glossary.md
